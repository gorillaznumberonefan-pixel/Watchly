<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Watchly</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Watchly</h1>
    </header>

    <main class="account-page">

        <div class="account-box">

            <h2>Create Account</h2>

            <label for="display-name">Display Name</label>
            <input
                type="text"
                id="display-name"
                placeholder="Your display name"
                autocomplete="name"
            >

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="@username"
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm password"
                autocomplete="new-password"
            >

            <button onclick="createAccount()">Create Account</button>

            <p id="account-message"></p>

            <p class="account-link">
                Already have an account?
                <a href="signin.html">Sign in</a>
            </p>

            <p class="account-link">
                <a href="index.html">← Back to Watchly</a>
            </p>

        </div>

    </main>

    <script>
        function createAccount() {
            const displayName =
                document.getElementById("display-name").value.trim();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;

            const message =
                document.getElementById("account-message");

            // Make sure every field is filled out
            if (!displayName || !username || !password || !confirmPassword) {
                message.textContent = "Please fill out every field.";
                return;
            }

            // Make sure the username starts with @
            if (!username.startsWith("@")) {
                message.textContent = "Your username must start with @.";
                return;
            }

            // Make sure the username has something after @
            if (username.length < 2) {
                message.textContent = "Please enter a username after @.";
                return;
            }

            // Make sure the passwords match
            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            // Make sure the password isn't extremely short
            if (password.length < 6) {
                message.textContent = "Your password must be at least 6 characters.";
                return;
            }

            /*
                Temporary account storage.

                This lets us test the account system before
                Watchly has a real backend.

                DO NOT use this for real passwords.
            */
            const account = {
                displayName: displayName,
                username: username
            };

            localStorage.setItem(
                "watchlyAccount",
                JSON.stringify(account)
            );

            // Tell the user the account was created
            message.textContent = "Account created! Welcome to Watchly!";

            // Give the message a moment to appear
            setTimeout(function() {
                window.location.href = "index.html";
            }, 1000);
        }
    </script>

</body>
</html>
